name: Verify and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo build --release --locked --package slim-cli --bins
      - if: runner.os == 'Windows'
        run: python scripts/smoke-release.py target/release/slim.exe
      - if: runner.os == 'macOS'
        run: python3 scripts/smoke-release.py target/release/slim
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SLIM-${{ matrix.os }}
          path: dist/
