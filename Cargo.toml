[workspace]
members = ["crates/slim-core", "crates/slim-db", "crates/slim-tui", "crates/slim-cli"]
resolver = "2"

# + for using workspace level conf
[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"

# + for using workspace deps
[workspace.dependencies]
# Domain
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde-human-readable", "formatting", "parsing", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
thiserror = "2"
anyhow = "1"

# Crypto & Auth
sha2 = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Terminal UI
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"

# Barcode & QR
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Configuration
toml = "0.8"
directories = "6"
serialport = { version = "4", default-features = false }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
tiny_http = "0.12"


# Internal crates
slim-core = { path = "crates/slim-core" }
slim-db = { path = "crates/slim-db" }
slim-tui = { path = "crates/slim-tui" }

# Testing
tempfile = "3"
